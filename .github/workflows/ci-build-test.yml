name: CI Build Test

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'CsharpAppBuildDocker.Api/**'
      - 'CsharpAppBuildDocker.Api.Tests/**'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: [self-hosted, Linux, X64, tech-reok-builders]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          path: src

      - name: Setup commit on version info
        shell: bash
        working-directory: src
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "Setting commit hash in appsettings.json: ${COMMIT_HASH}"
          # We use 'jq' to update the JSON file with the commit hash
          if [ -f CsharpAppBuildDocker.Api/appsettings.json ]; then
            jq --arg hash "$COMMIT_HASH" '.CommitHash = $hash' CsharpAppBuildDocker.Api/appsettings.json > tmp.$$.json && mv tmp.$$.json CsharpAppBuildDocker.Api/appsettings.json
            echo "Updated appsettings.json with commit hash."
          else
            echo "appsettings.json not found, skipping commit hash update."
          fi

      - name: Generate Docker tag
        id: meta
        shell: bash
        working-directory: src
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          DOCKER_TAG="marcocantugea/${REPO_NAME}:${SHORT_SHA}"

          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        working-directory: src
        run: |
          docker build \
            --target busybox_artifacts \
            -f .github/dockerfile \
            -t "${{ steps.meta.outputs.docker_tag }}" \
            .

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          docker push "${{ steps.meta.outputs.docker_tag }}"

      - name: Extract publish artifacts from image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: src
        run: |
          echo "Creating temporary container from image: ${{ steps.meta.outputs.docker_tag }}"
          CONTAINER=$(docker create "${{ steps.meta.outputs.docker_tag }}")
          echo "Copying /artifacts/publish from container $CONTAINER to ./publish"
          docker cp "$CONTAINER":/artifacts/publish ./publish || true
          docker rm "$CONTAINER" || true

      - name: Upload publish artifact
        id: upload_publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ steps.meta.outputs.short_sha }}
          path: src/publish/
          if-no-files-found: error

      - name: Job summary
        shell: bash
        working-directory: src
        run: |
          {
            echo "## CI Build/Test Summary"
            echo ""
            echo "- Docker tag: ${{ steps.meta.outputs.docker_tag }}"
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "- Docker image pushed: yes"
            else
              echo "- Docker image pushed: no (event: ${{ github.event_name }})"
            fi
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "- Publish artifact id: ${{ steps.upload_publish.outputs.artifact-id }}"
            else
              echo "- Publish artifact id: not-uploaded (event: ${{ github.event_name }})"
            fi
            echo ""
            if [ -f coveragereport/Summary.md ]; then
              echo "### Coverage report"
              cat coveragereport/Summary.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"